[package]
name = "rembg-rs"
version = "0.0.1"
edition = "2021"
description = "Remove image backgrounds — a Rust rewrite of python-rembg"
license = "MIT"
repository = "https://github.com/mjtiempo/rembg-rs"
readme = "README.md"
keywords = ["image", "background-removal", "onnx", "matting"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
ort = "2.0.0-rc.13"
image = "0.25"
ndarray = "0.17"
clap = { version = "4", features = ["derive"] }
ureq = "2.12"
sha2 = "0.10"
md-5 = "0.10"
kamadak-exif = "0.6"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
